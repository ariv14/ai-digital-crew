name: Daily AI Project of the Day (Staging)

# NOTE: scheduled cron removed — daily run fires from Cloudflare Worker →
# Pipedream (see pipeline/README.md). workflow_dispatch kept as break-glass.
on:
  workflow_dispatch:

jobs:
  scrape:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run daily scraper (staging)
        working-directory: scripts
        run: node daily-scrape.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_NOTIFY: 'true'
          SKIP_PUBLISH: 'true'
