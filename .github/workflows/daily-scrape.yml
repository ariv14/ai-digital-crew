name: Daily AI Project of the Day

# The daily run happens here, on Actions. The Cloudflare Worker → Pipedream
# alternative in pipeline/ was never finished (the Worker was never deployed and
# the Pipedream scraper workflow was never created), and Pipedream's free tier
# bills 1 credit per 30s of compute against a 100-credit monthly quota — a 2-9
# minute daily run costs 120-300 credits/month, so it cannot afford this job.
# Actions minutes are free and unlimited for public repos like this one; the
# "$0 budget" that prompted the migration only applies to private repos.
on:
  schedule:
    # 08:00 UTC daily — the schedule this job ran on until 2026-04-06.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip the Substack newsletter (use for smoke tests)'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run daily scraper
        working-directory: scripts
        run: node daily-scrape.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIPEDREAM_WEBHOOK_URL: ${{ secrets.PIPEDREAM_WEBHOOK_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          # Two independent guards on owner-notification issues, both deliberate:
          # NOTIFY_OWNER is not set (the gate is opt-in and fails closed), and
          # SKIP_NOTIFY overrides it even if someone sets it. See ARCHITECTURE.md §8.3.
          SKIP_NOTIFY: 'true'

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily scrape FAILED — ${date}`,
              body: `The daily pipeline failed. The website may be showing stale data.\n\nCheck logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['pipeline-failure'],
            });
