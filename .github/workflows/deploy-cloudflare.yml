name: Deploy Production

# MANUAL ONLY as of 2026-07-28.
#
# aidigitalcrew.com is now served by the Next.js rewrite in
# ariv14/ai-digital-crew-next, which deploys to this same Cloudflare Pages
# project (aidigitalcrew). While this ran on push, any commit to main would
# have reverted the live production site to this legacy one.
#
# Kept rather than deleted so it stays available as a rollback: run it from the
# Actions tab to put the legacy site back on production.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aidigitalcrew --branch=main
